# Extra pacman NoExtract patterns for this preset, one per line.
# A later pattern wins over an earlier one; "!" keeps a file.

# CJK fonts: keep only Noto Sans CJK Regular and Bold. Each file covers Chinese,
# Japanese and Korean; the other 5 Sans weights and all 7 Serif weights would
# add about 170 MiB to the ISO.
usr/share/fonts/noto-cjk/*
!usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
!usr/share/fonts/noto-cjk/NotoSansCJK-Bold.ttc
