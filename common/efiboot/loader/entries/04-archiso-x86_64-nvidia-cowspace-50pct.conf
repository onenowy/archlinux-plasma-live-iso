title   Arch Linux (%ARCH%, UEFI) with NVIDIA driver loaded early and 50% RAM cowspace
sort-key 04
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% modules_load=nvidia_drm cow_spacesize=50% %KERNEL_PARAMS%
